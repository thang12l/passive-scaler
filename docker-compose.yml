services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: passive
      POSTGRES_PASSWORD: passive
      POSTGRES_DB: passive_scaler
    # Override with DB_PORT=5434 docker compose up (or set DB_PORT in .env)
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passive -d passive_scaler"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      target: dev
    restart: unless-stopped
    # Override with PORT=3002 docker compose up (or set PORT in .env)
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://passive:passive@db:5432/passive_scaler
      NODE_ENV: development
      PORT: ${PORT:-3001}
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  app_node_modules:
